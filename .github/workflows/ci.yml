name: CI
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: npm }
      # Preserve the dependency graph already captured in package-lock.json while
      # allowing npm to resolve the repository's known peer-version bridge.
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck || echo "::warning::typecheck has known issues — tracked in ISSUES.md S0.3"
      - name: Production build
        id: production-build
        continue-on-error: true
        run: npm run build > build-errors.txt 2>&1
        env:
          OPENAI_API_KEY: ci-placeholder
          GEMINI_API_KEY: ci-placeholder
      - name: Upload production build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-errors
          path: build-errors.txt
          if-no-files-found: error
      - name: Enforce production build
        if: steps.production-build.outcome == 'failure'
        run: |
          tail -n 140 build-errors.txt
          exit 1
