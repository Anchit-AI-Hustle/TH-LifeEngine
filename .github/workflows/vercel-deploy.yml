name: Vercel Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # vercel/actions/deploy does not exist, so the job failed before any step
      # ran. Deploy with the official Vercel CLI instead, when the secrets exist.
      # VERCEL_TOKEN is scoped to the steps that need it, so npm install scripts
      # and the build above never see it.
      - name: Check Vercel secrets
        id: secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel (if secrets available)
        if: steps.secrets.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@65.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@65.2.0 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@65.2.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Hint when secrets missing
        if: steps.secrets.outputs.available != 'true'
        run: |
          echo "::warning::Skipped the CLI deploy: set VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID as repository secrets to deploy from this workflow. The Vercel Git integration still deploys pushes to main."
